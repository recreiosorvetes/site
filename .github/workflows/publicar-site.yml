name: Publicar site Recreio

on:
  push:
    branches: [main]
    paths:
      - recreio-site-github-leve.zip
      - .github/workflows/publicar-site.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preparar os arquivos do site
        run: |
          mkdir -p _site temp
          unzip -q recreio-site-github-leve.zip -d temp
          cp -a temp/recreio-site-github-leve/. _site/
      - uses: actions/configure-pages@v5
      - name: Limpar artefatos de tentativas anteriores
        uses: actions/github-script@v7
        with:
          script: |
            const { data: { artifacts } } = await github.rest.actions.listWorkflowRunArtifacts({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId,
            });
            for (const artifact of artifacts.filter((item) => item.name === "github-pages")) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id,
              });
            }
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Aguardar a indexação do artefato
        run: sleep 10
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
